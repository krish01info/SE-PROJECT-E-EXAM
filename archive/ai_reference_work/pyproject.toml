[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ems"
version = "1.0.0"
description = "Exam Management System: automated exam scheduling, seating allocation and invigilation duty assignment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["ortools>=9.10"]
authors = [
  { name = "Harsh Vardhan" }, { name = "Himank Swami" }, { name = "Ishan Batra" },
  { name = "Koushik Araveti" }, { name = "Krish Sharma" },
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ems = "ems.cli:main"

[tool.setuptools]
packages = ["ems"]

[tool.pytest.ini_options]
testpaths = ["tests"]
